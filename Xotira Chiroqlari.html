<!DOCTYPE html>
<!-- saved from url=(0047)https://reyzer2112.github.io/Xotira-Chiroqlari/ -->
<html lang="uz">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xotira Chiroqlari | REYZER</title>
  <style>
    /* CSS QISMI - KUCHAYTIRILGAN ANIMATSIYALAR */
    :root {
      --accent: #f1c40f;
      /* Oltin/Neon sariq */
      --bg-dark: #000;
      --pad-active-filter: brightness(2.5) scale(1.05);
      /* Kuchliroq chaqnash */
      --transition-fast: 0.1s ease-in-out;
      --transition-slow: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      /* Koptoksimon harakat */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* ORQA FON OLDINGIDEK QAQTARILDI */
      background: radial-gradient(circle at center, #222 0%, #000 70%);
      color: #f5f5f5;
      overflow: hidden;
    }

    .game {
      background: #111;
      border-radius: 20px;
      padding: 1rem;
      /* Sig'ishi uchun biroz kamaytirildi */
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      text-align: center;
      width: 95%;
      max-width: 340px;
      /* Ekranga to'liq sig'ishi uchun optimallashtirildi */
      position: relative;
      border: 2px solid #333;
      transition: transform 0.2s ease;
    }

    h1 {
      margin-bottom: 0.8rem;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #eee;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      /* Masofa optimallashtirildi */
      margin-bottom: 1rem;
      aspect-ratio: 1 / 1;
    }

    .pad {
      border-radius: 18px;
      cursor: pointer;
      /* ANIMATSIYA KUCHAYTIRILDI */
      transition: transform var(--transition-fast), filter var(--transition-fast), box-shadow var(--transition-fast);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Klaviatura harflari faqat desktopda */
    @media (hover: hover) and (pointer: fine) {
      .pad::after {
        content: attr(data-key);
        position: absolute;
        top: 15px;
        left: 15px;
        font-size: 0.8rem;
        opacity: 0.5;
        color: white;
        font-weight: bold;
      }

      .keyboard-hint {
        display: block !important;
      }
    }

    #green {
      background: #0a7f3f;
      border: 2px solid #0f9d58;
    }

    #red {
      background: #b31217;
      border: 2px solid #db4437;
    }

    #yellow {
      background: #c9a100;
      border: 2px solid #f4b400;
    }

    #blue {
      background: #005b96;
      border: 2px solid #4285f4;
    }

    /* CHAQNASH EFFEKTI KUCHAYTIRILDI */
    .pad.active {
      filter: var(--pad-active-filter);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
      z-index: 10;
      /* Ustiga chiqishi uchun */
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .display-group {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .display {
      background: #000;
      border-radius: 10px;
      padding: 0.5rem;
      flex: 1;
      border: 1px solid #222;
    }

    .display .label {
      display: block;
      font-size: 0.6rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #count,
    #high-score {
      font-weight: bold;
      font-size: 1.2rem;
    }

    #count {
      color: #0f0;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }

    #high-score {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0.8rem 0.4rem;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
    }

    #start {
      background: #1b5e20;
      border-bottom: 4px solid #145214;
    }

    #start:hover {
      background: #1e6b24;
    }

    #reset {
      background: #b71c1c;
      border-bottom: 4px solid #8e1414;
    }

    #reset:hover {
      background: #d32f2f;
    }

    #settings-btn {
      background: #333;
      border-bottom: 4px solid #222;
      grid-column: span 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 2px;
    }

    #settings-btn:hover {
      background: #444;
    }

    .message {
      margin-top: 0.8rem;
      min-height: 1.2em;
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: bold;
      text-shadow: 0 0 5px rgba(241, 196, 15, 0.5);
    }

    hr {
      margin: 10px auto;
      border: 0;
      border-top: 2px solid #222;
      width: 90%;
    }

    .keyboard-hint {
      display: none;
      font-size: 0.7rem;
      color: #555;
    }

    /* SOZLAMALAR MODAL - KUCHAYTIRILGAN DESIGN VA ANIMATSIYA */
    .modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 1rem;
      border-radius: 20px;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.3s ease-out;
      /* Ochilish animatsiyasi */
    }

    .modal.show {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .modal h3 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* YARATUVCHI BO'LIMI KUCHAYTIRILDI */
    .creator-section h3 {
      color: #fff;
      font-size: 1.1rem;
    }

    .creator-info {
      font-size: 0.85rem;
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .creator-info b {
      color: var(--accent);
      font-size: 1.4rem;
      /* REYZER nomi kattalashtirildi */
      text-shadow: 0 0 20px var(--accent);
      font-family: 'Courier New', Courier, monospace;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }

    input[type="color"] {
      width: 30px;
      height: 30px;
      border: none;
      background: none;
      cursor: pointer;
    }

    /* 6 TA IJTIMOIY TARMOQ VA KUCHLI ANIMATSIYA */
    .social-links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 15px 0;
      justify-items: center;
    }

    .social-links a img {
      width: 38px;
      height: 38px;
      transition: all var(--transition-slow);
      filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.8));
    }

    .social-links a:hover img {
      transform: scale(1.3) rotate(360deg);
      filter: drop-shadow(0 0 15px var(--accent));
    }

    .close-btn {
      background: var(--accent);
      color: #000;
      width: 100%;
      margin-top: 10px;
      border-bottom: 4px solid #b7950b;
      padding: 0.6rem;
    }
  </style>
</head>

<body>

  <div class="game" id="gameWindow">
    <h1>Xotira Chiroqlari</h1>

    <div class="board">
      <div class="pad" id="green" data-key="Q"></div>
      <div class="pad" id="red" data-key="W"></div>
      <div class="pad" id="yellow" data-key="A"></div>
      <div class="pad" id="blue" data-key="S"></div>
    </div>

    <div class="controls">
      <div class="display-group">
        <div class="display">
          <span class="label">Ochko</span>
          <span id="count">--</span>
        </div>
        <div class="display">
          <span class="label">Rekord</span>
          <span id="high-score">00</span>
        </div>
      </div>

      <div class="btn-row">
        <button id="start">Boshlash</button>
        <button id="reset">Tozalash</button>
        <button id="settings-btn">⚙️ Sozlamalar</button>
      </div>
    </div>

    <div id="message" class="message">Tugmani bosing</div>
    <hr>
    <div class="keyboard-hint">Kompyuterda: Q, W, A, S</div>

    <div id="settings-modal" class="modal show">
      <h3>Ranglar</h3>

      <div class="setting-item">
        <span style="font-size: 0.9rem; font-weight: bold;">Yuqori-chap</span>
        <input type="color" id="color-0" value="#0a7f3f">
      </div>
      <div class="setting-item">
        <span style="font-size: 0.9rem; font-weight: bold;">Yuqori-o'ng</span>
        <input type="color" id="color-1" value="#b31217">
      </div>
      <div class="setting-item">
        <span style="font-size: 0.9rem; font-weight: bold;">Pastki-chap</span>
        <input type="color" id="color-2" value="#c9a100">
      </div>
      <div class="setting-item">
        <span style="font-size: 0.9rem; font-weight: bold;">Pastki-o'ng</span>
        <input type="color" id="color-3" value="#005b96">
      </div>

      <hr style="width: 100%; border-top: 2px solid #333;">

      <div class="creator-section">
        <h3>⚡ YARATUVCHI:</h3>
        <p class="creator-info"><b>REYZER</b><br>v3.0 Ultra Edition</p>
      </div>

      <div class="social-links">

        <a href="https://t.me/ReyZer2112" target="_blank"><img src="Xotira Chiroqlari-Telegram.png" alt="Telegram"></a>

        <a href="https://instagram.com/reyzer2112" target="_blank"><img src="Xotira Chiroqlari-Instagram.png"
            alt="Instagram"></a>

        <a href="https://www.youtube.com/@ReyZer2112" target="_blank"><img src="Xotira Chiroqlari-YouTube.png"
            alt="YouTube"></a>

        <a href="https://www.roblox.com/users/11746345524/profile" target="_blank"><img
            src="Xotira Chiroqlari-Roblox.png" alt="Roblox"></a>

        <a href="https://www.snapchat.com/add/reyzer2112" target="_blank"><img src="Xotira Chiroqlari-Snapchat.png"
            alt="Snapchat"></a>


        <a href="https://discord.com/invite/reyzer2112" target="_blank"><img src="Xotira Chiroqlari-Discord.png"
            alt="Discord"></a>
      </div>

      <button id="reset-colors-btn"
        style="background: #444; border-bottom: 3px solid #222; margin-top: 5px; font-size: 0.7rem; width: 100%;">
        ♻️ Ranglarni tiklash
      </button>

      <button class="close-btn" id="close-settings">Yopish</button>
    </div>
  </div>

  <script>
    /* JAVASCRIPT QISMI - O'YIN LOGIKASI VA EFFEKTLAR */
    const pads = [document.getElementById("green"), document.getElementById("red"), document.getElementById("yellow"), document.getElementById("blue")];
    const startBtn = document.getElementById("start"), resetBtn = document.getElementById("reset"), settingsBtn = document.getElementById("settings-btn"), settingsModal = document.getElementById("settings-modal"), closeSettings = document.getElementById("close-settings"), countDisplay = document.getElementById("count"), highScoreDisplay = document.getElementById("high-score"), messageEl = document.getElementById("message"), gameWindow = document.getElementById("gameWindow");
    const resetColorsBtn = document.getElementById("reset-colors-btn");
    const defaultColors = ["#0a7f3f", "#b31217", "#c9a100", "#005b96"];

    const sounds = [
      new Audio("https://cdn.freecodecamp.org/curriculum/take-home-projects/memory-light-game/sound-1.mp3"),
      new Audio("https://cdn.freecodecamp.org/curriculum/take-home-projects/memory-light-game/sound-2.mp3"),
      new Audio("https://cdn.freecodecamp.org/curriculum/take-home-projects/memory-light-game/sound-3.mp3"),
      new Audio("https://cdn.freecodecamp.org/curriculum/take-home-projects/memory-light-game/sound-4.mp3")
    ];

    let sequence = [], userIndex = 0, isPlayingBack = false, gameOn = false, highScore = localStorage.getItem("memScore") || 0;
    highScoreDisplay.textContent = highScore.toString().padStart(2, '0');

    settingsBtn.onclick = () => { settingsModal.classList.add("show"); };
    closeSettings.onclick = () => { settingsModal.classList.remove("show"); };

    for (let i = 0; i < 4; i++) {
      document.getElementById(`color-${i}`).oninput = (e) => { pads[i].style.backgroundColor = e.target.value; };
    }

    startBtn.onclick = () => { if (!gameOn) { gameOn = true; sequence = []; addStep(); playSequence(); } };
    resetBtn.onclick = () => {
      gameOn = false; sequence = []; countDisplay.textContent = "--"; messageEl.textContent = "Tozalandi.";
      gameWindow.style.transform = 'none';
    };

    const keyMap = { 'q': 0, 'w': 1, 'a': 2, 's': 3, 'Q': 0, 'W': 1, 'A': 2, 'S': 3 };
    window.onkeydown = (e) => { if (keyMap[e.key] !== undefined) handlePadClick(keyMap[e.key]); };
    pads.forEach((pad, index) => pad.onclick = () => handlePadClick(index));

    function addStep() {
      sequence.push(Math.floor(Math.random() * 4));
      let len = sequence.length;
      countDisplay.textContent = len.toString().padStart(2, '0');
      if (len > highScore) { highScore = len; localStorage.setItem("memScore", highScore); highScoreDisplay.textContent = highScore.toString().padStart(2, '0'); }
    }

    function playSequence() {
      isPlayingBack = true; userIndex = 0; let i = 0;
      messageEl.textContent = "Kuzating...";
      let interval = setInterval(() => {
        if (i >= sequence.length) { clearInterval(interval); isPlayingBack = false; messageEl.textContent = "Sizning navbatingiz!"; return; }
        flash(sequence[i]); i++;
      }, 600);
    }

    function flash(idx) {
      pads[idx].classList.add("active");
      sounds[idx].currentTime = 0; sounds[idx].play().catch(() => { });
      setTimeout(() => pads[idx].classList.remove("active"), 350);
    }

    function handlePadClick(idx) {
      if (!gameOn || isPlayingBack) return;
      flash(idx);
      if (idx === sequence[userIndex]) {
        userIndex++;
        if (userIndex === sequence.length) {
          isPlayingBack = true; messageEl.textContent = "To'g'ri!";
          setTimeout(() => { addStep(); playSequence(); }, 800);
        }
      } else {
        messageEl.textContent = "Xato!";
        countDisplay.textContent = "!!";
        isPlayingBack = true;
        gameWindow.style.transform = 'translateX(10px)';
        setTimeout(() => gameWindow.style.transform = 'translateX(-10px)', 50);
        setTimeout(() => gameWindow.style.transform = 'translateX(0)', 100);
        setTimeout(() => { userIndex = 0; playSequence(); }, 1200);
      }
    }

    // Ranglarni asliga qaytarish buyrug'i
    resetColorsBtn.onclick = () => {
      defaultColors.forEach((color, i) => {
        pads[i].style.backgroundColor = color;
        document.getElementById(`color-${i}`).value = color;
      });
      messageEl.textContent = "Ranglar tiklandi!";
    };

  </script>


</body>

</html>
